<footer class="ftb"><div class="kit-container">
  <div class="ftb__grid">
    <div><p class="ftb__label">Find us</p><p>{{address}}</p><a class="kit-link" href="{{map_link}}">Directions</a></div>
    <div><p class="ftb__label">Talk to us</p><p><a class="kit-link" href="tel:{{phone}}">{{phone}}</a></p><!-- if:email --><p><a class="kit-link" href="mailto:{{email}}">{{email}}</a></p><!-- /if:email --></div>
    <div><p class="ftb__label">Follow</p><!-- if:instagram_url --><p><a class="kit-link" href="{{instagram_url}}">Instagram</a></p><!-- /if:instagram_url --><!-- if:facebook_url --><p><a class="kit-link" href="{{facebook_url}}">Facebook</a></p><!-- /if:facebook_url --></div>
  </div>
  <!-- if:photo_credit --><small>{{photo_credit}}</small><!-- /if:photo_credit -->
  <p class="ftb__name" aria-hidden="true">{{restaurant_name}}</p>
</div></footer>
