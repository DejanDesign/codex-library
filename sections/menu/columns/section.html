<section class="kit-section menu-columns" data-section="menu_preview" id="menu"><div class="kit-container">
  <h2 class="kit-h2" data-reveal>On the menu</h2>
  <div class="menu-columns__grid" data-reveal-group><!-- {{menu_items}} --><!-- repeat:menu_items --><div class="kit-menu-item" data-reveal><span class="kit-menu-item__name">{{item.name}}</span><span class="kit-menu-item__price">{{item.price}}</span><p class="kit-menu-item__desc">{{item.description}}</p></div><!-- /repeat:menu_items --></div>
  <div class="menu-columns__foot"><span class="kit-muted">Ask us about today's specials.</span><a class="kit-btn kit-btn--ghost" href="tel:{{phone}}">Call {{phone}}</a></div>
</div></section>
