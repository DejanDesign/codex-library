<section class="kit-section kit-section--tint contact-split" data-section="contact" id="visit"><div class="kit-container contact-split__grid">
  <div data-reveal-group><h2 class="kit-h2" data-reveal>Visit us</h2><p class="kit-lead" data-reveal>{{address}}</p><div data-reveal><ul class="contact-split__hours"><!-- {{hours}} --><!-- repeat:hours --><li><span>{{day.label}}</span><span>{{day.time}}</span></li><!-- /repeat:hours --></ul></div>
    <div class="contact-split__lines" data-reveal><a class="kit-link" href="tel:{{phone}}">{{phone}}</a><!-- if:email --><a class="kit-link" href="mailto:{{email}}">{{email}}</a><!-- /if:email --><!-- if:whatsapp --><a class="kit-link" href="https://wa.me/{{whatsapp}}">WhatsApp</a><!-- /if:whatsapp --></div></div>
  <a class="kit-media contact-split__map kit-hover-shine" href="{{map_link}}" data-reveal="zoom"><span class="kit-btn kit-btn--glass">Open in Google Maps</span></a>
</div></section>
