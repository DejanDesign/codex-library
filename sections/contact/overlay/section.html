<section class="contact-overlay" data-section="contact" id="visit">
  <div class="kit-media contact-overlay__bg"><img src="{{hero_image}}" alt=""></div>
  <div class="kit-container"><div class="contact-overlay__card" data-reveal="up"><h2 class="kit-h2">Visit us</h2><p class="kit-muted">{{address}}</p><ul class="contact-overlay__hours"><!-- {{hours}} --><!-- repeat:hours --><li><span>{{day.label}}</span><span>{{day.time}}</span></li><!-- /repeat:hours --></ul><div style="display:flex;flex-wrap:wrap;gap:.75rem;margin-top:1.5rem"><a class="kit-btn kit-btn--primary" href="tel:{{phone}}">Call</a><a class="kit-btn kit-btn--ghost" href="{{map_link}}">Directions</a></div></div></div>
</section>
