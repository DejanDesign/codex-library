<section class="hero-framed" data-section="hero" id="top">
  <div class="kit-media hero-framed__photo" data-reveal="clip"><img class="kit-slowzoom" src="{{hero_image}}" alt="{{restaurant_name}}"></div>
  <div class="kit-container hero-framed__text" data-reveal-group>
    <h1 class="kit-display" data-reveal>{{restaurant_name}}</h1>
    <div data-reveal><p style="opacity:.85">{{tagline}}</p><div style="display:flex;flex-wrap:wrap;gap:.75rem"><!-- if:booking_url --><a class="kit-btn kit-btn--light" href="{{booking_url}}">Book a table</a><!-- /if:booking_url --><a class="kit-btn kit-btn--glass" href="tel:{{phone}}">Call {{phone}}</a></div></div>
  </div>
</section>
