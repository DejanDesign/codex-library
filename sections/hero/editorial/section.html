<section class="hero-editorial" data-section="hero" id="top">
  <div class="kit-container">
    <h1 class="hero-editorial__name kit-break" data-reveal="blur">{{restaurant_name}}</h1>
    <div class="hero-editorial__row">
      <div data-reveal-group><p class="kit-lead" data-reveal>{{tagline}}</p><div style="display:flex;flex-wrap:wrap;gap:.75rem" data-reveal><!-- if:booking_url --><a class="kit-btn kit-btn--primary" href="{{booking_url}}">Book a table</a><!-- /if:booking_url --><a class="kit-btn kit-btn--text" href="#menu">See the menu</a></div></div>
      <div class="kit-media hero-editorial__photo" data-reveal="clip"><img src="{{hero_image}}" alt="{{restaurant_name}}"></div>
    </div>
  </div>
</section>
