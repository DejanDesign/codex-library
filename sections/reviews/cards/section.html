<section class="kit-section reviews-cards" data-section="reviews" id="reviews"><div class="kit-container">
  <h2 class="kit-h2" data-reveal>What guests say</h2>
  <div class="reviews-cards__grid" data-reveal-group><!-- {{reviews}} --><!-- repeat:reviews --><figure class="kit-card kit-hover-lift" data-reveal><div class="kit-stars" aria-label="{{review.rating}} out of 5">{{review.stars}}</div><blockquote class="kit-quote" style="margin:0">{{review.text}}</blockquote><figcaption><strong>{{review.author}}</strong>, <span class="kit-source">Google review</span></figcaption></figure><!-- /repeat:reviews --></div>
</div></section>
